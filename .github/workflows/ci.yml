name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_landing_saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_landing_saas_test
      LOG_LEVEL: silent
      SHOPIFY_API_KEY: ci-test-api-key
      SHOPIFY_API_SECRET: ci-test-api-secret
      SHOPIFY_APP_URL: https://ci-app.test.example
      SHOPIFY_API_VERSION: 2025-01
      SHOPIFY_SCOPES: read_products
      # 32 random bytes, base64 — CI-only fixture, never used outside this workflow.
      TOKEN_ENCRYPTION_KEY: R8acOX5NehwX4gzHvkP8DUoBkPop0qyDCkLrCrbEISI=

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Generate Prisma client and apply migrations
        run: |
          npm run prisma:generate --workspace=server
          npx --workspace=server prisma migrate deploy

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build

      - name: Smoke test /health against real Postgres
        run: |
          node server/dist/index.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/health; then break; fi
            sleep 1
          done
          curl -sf http://localhost:3000/health | tee /tmp/health.json
          grep -q '"database":"connected"' /tmp/health.json
          kill $SERVER_PID
